<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS 3D Monitor</title>
    <style>
        /* Базовые настройки сцены */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121214;
            font-family: sans-serif;
            color: #fff;
            overflow: hidden;
            perspective: 1200px; /* Глубина 3D сцены */
        }

        .scene {
            position: relative;
            width: 400px;
            height: 300px;
            transform-style: preserve-3d;
            animation: rotateMonitor 10s linear infinite; /* Постоянное 3D вращение */
        }

        /* 3D Конструкция Монитора */
        .monitor-body {
            position: absolute;
            width: 400px;
            height: 240px;
            background: #2a2b30;
            border: 8px solid #1e1f22;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            transform-style: preserve-3d;
        }

        /* Экран с картинкой (вставляем твой пляж) */
        .screen {
            position: absolute;
            inset: 0;
            background: url('https://unsplash.com') center/cover;
            border-radius: 4px;
        }

        /* Задняя панель монитора для объема */
        .back-panel {
            position: absolute;
            inset: -8px;
            background: #1a1b1e;
            transform: translateZ(-15px); /* Сдвигаем назад для толщины */
            border-radius: 8px;
            border: 2px solid #2a2b30;
        }

        /* Подставка (Ножка) */
        .stand-neck {
            position: absolute;
            width: 30px;
            height: 80px;
            background: #1e1f22;
            left: 185px;
            top: 246px;
            transform: translateZ(-7px) rotateX(-10px);
            box-shadow: inset 0 0 10px #000;
        }

        /* Основание подставки на столе */
        .stand-base {
            position: absolute;
            width: 160px;
            height: 100px;
            background: #1a1b1e;
            left: 120px;
            top: 290px;
            transform: rotateX(80px) translateZ(-10px);
            border-radius: 50% / 20%;
            box-shadow: 0 20px 20px rgba(0,0,0,0.6);
            border-bottom: 4px solid #111;
        }

        /* Анимация плавного вращения в пространстве */
        @keyframes rotateMonitor {
            0% { transform: rotateY(0deg) rotateX(5deg); }
            50% { transform: rotateY(180deg) rotateX(-5deg); }
            100% { transform: rotateY(360deg) rotateX(5deg); }
        }

        .info {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Сам монитор -->
        <div class="monitor-body">
            <div class="back-panel"></div>
            <div class="screen"></div>
        </div>
        <!-- Ножка и подставка -->
        <div class="stand-neck"></div>
        <div class="stand-base"></div>
    </div>

    <div class="info">
        <h3>Интерактивная 3D-модель монитора (Построена на HTML/CSS)</h3>
    </div>

</body>
</html>
